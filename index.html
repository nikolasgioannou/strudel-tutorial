<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Strudel Tutorial</title>

    <!-- Tailwind v4, processed by bun-plugin-tailwind during dev/build. -->
    <link rel="stylesheet" href="./src/styles.css" />

    <!--
      Strudel REPL custom element. Loads <strudel-editor> globally before any
      React code runs. Pinned to 1.3.0 so future Strudel changes can't break
      the tutorial unannounced.
    -->
    <script src="https://unpkg.com/@strudel/repl@1.3.0"></script>
  </head>
  <body class="min-h-dvh bg-neutral-950 text-neutral-100 antialiased">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
